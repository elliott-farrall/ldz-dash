name: Deploy
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - feature/**
env:
  environment: ${{ github.event_name == 'push' && 'production' || 'development' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.environment }}
      url: ${{ vars.URL}}
    steps:
      - name: Trigger Update
        run: |
          curl -f -X POST \
            -H "Content-Type: application/json" \
            -H "X-Secret-Key: ${{ secrets.SECRET_KEY }}" \
            -H "X-WSGI-Path: ${{ vars.WSGI_PATH }}" \
            -d "{'ref': '${{ github.ref }}', 'after': '${{ github.sha }}'}" \
          "${{ vars.URL }}/api/update"
  post-deploy:
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: ${{ vars.environment }}
      url: ${{ vars.URL}}
    steps:
      - name: Check Update
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: |
            VERSION=$(curl -f "${{ vars.URL }}/api/version")
            if [[ "$VERSION" != "${{ github.sha }}" ]]; then
              echo "Update did not complete successfully"
              exit 1
            fi
